# The [project] table exists so `uv lock` can pin the gate's own tools; this
# repo is not a package, which is what `package = false` says. Without a
# lockfile that names mypy and pytest the gate exits 2 (python-sdlc,
# need_lock_dep) rather than reporting a pass it never ran.
[project]
name = "pbs"
version = "3.0.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Loose files, not a package, so mypy is pointed at them by path.
[tool.mypy]
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/pbs"
# pbs is a run-to-completion CLI: no units to bring up, no port, no HEALTHCHECK,
# nothing for the image job's profiles to boot. The gate it ran lives in
# `boot-gate` below, run inside the built image.
boot = "none"
boot-none-reason = "run-to-completion CLI with no server; the boot-gate ci check runs the entrypoint inside this image"

[tool.sdlc.ci]
checks = ["pbs-image", "boot-gate"]

[tool.sdlc.ci.pbs-image]
kind = "image-build"

# The boot gate container.yml ran (tests/image/boot-check.sh): the entrypoint
# answers -h with every flag the units use, rejects an unknown option with 2,
# and every tool pbs.sh shells out to is installed. argv[0] replaces the
# image's entrypoint, and the script calls pbs.sh itself.
[tool.sdlc.ci.boot-gate]
kind = "command"
image = "localhost/pbs:sdlc"
argv = ["bash", "tests/image/boot-check.sh"]
